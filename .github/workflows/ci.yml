name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and verify with Maven
        run: mvn -B "-Dgameshelf.uiTest=true" clean verify

      - name: Generate SHA-256 manifest for portable build
        shell: pwsh
        run: |
          Set-Location target
          Get-FileHash -Algorithm SHA256 -Path *.jar,lib/*.jar | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetRelativePath((Get-Location).Path,$_.Path))"
          } | Set-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gameshelf-windows
          path: |
            target/*.jar
            target/lib/*.jar
            target/SHA256SUMS.txt
